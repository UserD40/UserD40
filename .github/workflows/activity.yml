name: Recent activity

# Updates the <!--START_SECTION:activity--> block in README.md with recent
# GitHub activity. Uses the built-in GITHUB_TOKEN — no extra setup needed.

on:
  schedule:
    - cron: "0 */12 * * *"     # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: "chore: refresh recent activity"
          MAX_LINES: 5
