name: WakaTime stats

# Updates the <!--START_SECTION:waka--> block in README.md with a weekly coding
# breakdown.
# SETUP (one-time):
#   1. Create a free account at https://wakatime.com
#   2. Install the WakaTime plugin in your editor(s) (VS Code, JetBrains, etc.)
#   3. Copy your API key from https://wakatime.com/settings/account
#   4. Add it to this repo as a secret named WAKATIME_API_KEY
#      (Settings > Secrets and variables > Actions > New repository secret)
# Data accrues from when tracking is installed.

on:
  schedule:
    - cron: "30 0 * * *"      # daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          SHOW_TIME: "true"
