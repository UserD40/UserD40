name: Snake

# Generates a flat, animated contribution "snake" SVG and commits it to the
# 'output' branch; the README embeds it from raw.githubusercontent (.../output/...).
# Uses the built-in GITHUB_TOKEN — no PAT needed.

on:
  schedule:
    - cron: "0 */12 * * *"     # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
